name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: "Gerar .ipa ASSINADO (exige os secrets de assinatura; veja docs/GITHUB_BUILD.md)"
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-linux:
    name: Testes do FloorPlanCore (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/FloorPlanCore

  build:
    name: Compilar app (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar o Xcode mais novo instalado
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Testes do FloorPlanCore (macOS)
        run: swift test --package-path Packages/FloorPlanCore

      - name: Gerar projeto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      # Prova que o app compila. RoomPlan precisa de LiDAR e não roda no simulador.
      - name: Compilar para iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project FloorPlanScanner.xcodeproj -scheme FloorPlanScanner \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-simulator.log

      # .ipa SEM assinatura: não instala direto no iPhone; serve para reassinar (AltStore, Sideloadly etc.).
      - name: Arquivar sem assinatura e empacotar .ipa
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FloorPlanScanner.xcodeproj -scheme FloorPlanScanner \
            -destination 'generic/platform=iOS' \
            -archivePath build/FloorPlanScanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            | tee build-archive.log
          mkdir -p build/Payload
          cp -R build/FloorPlanScanner.xcarchive/Products/Applications/*.app build/Payload/
          (cd build && zip -qry FloorPlanScanner-unsigned.ipa Payload)

      - name: Enviar .ipa sem assinatura
        uses: actions/upload-artifact@v4
        with:
          name: FloorPlanScanner-unsigned-ipa
          path: build/FloorPlanScanner-unsigned.ipa
          if-no-files-found: error

      - name: Enviar logs de compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore

  signed-ipa:
    name: .ipa assinado (opcional)
    if: github.event_name == 'workflow_dispatch' && inputs.signed
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets
        run: |
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret ausente: $v (veja docs/GITHUB_BUILD.md)"; exit 1; fi
          done

      - name: Selecionar o Xcode mais novo instalado
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Instalar certificado e perfil de provisionamento
        run: |
          CERT="$RUNNER_TEMP/certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Gerar projeto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Arquivar e exportar .ipa assinado
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FloorPlanScanner.xcodeproj -scheme FloorPlanScanner \
            -destination 'generic/platform=iOS' \
            -archivePath build/FloorPlanScanner.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Development" \
            | tee build-signed.log

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.example.floorplanscanner</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/FloorPlanScanner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export | tee -a build-signed.log

      - name: Enviar .ipa assinado
        uses: actions/upload-artifact@v4
        with:
          name: FloorPlanScanner-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Enviar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-build-log
          path: build-signed.log
          if-no-files-found: ignore

      - name: Remover keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
