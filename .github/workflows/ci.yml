name: CI
on: [push, pull_request]

jobs:
  core-linux:
    name: FloorPlanCore tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/FloorPlanCore

  app-macos:
    name: Core tests + app build (macOS, iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/FloorPlanCore
      - run: brew install xcodegen
      - run: xcodegen generate
      # Só prova que compila; RoomPlan exige LiDAR e não roda no simulador.
      - run: >
          xcodebuild build -project FloorPlanScanner.xcodeproj -scheme FloorPlanScanner
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
